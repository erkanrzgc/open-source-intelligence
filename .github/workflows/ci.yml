name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,report,socks,whois,photo,dns]"

      - name: Ruff
        run: ruff check core modules utils scripts tests mcp_server.py

      - name: Mypy
        run: mypy --ignore-missing-imports core modules utils scripts/provider_contract_smoke.py

      - name: Bandit
        run: bandit -r core modules utils mcp_server.py scripts/provider_contract_smoke.py -q

      - name: Pytest
        run: pytest --timeout=30 --cov=core --cov=modules --cov=utils --cov-report=term-missing

      - name: Build and smoke-test wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/osint-wheel-smoke
          /tmp/osint-wheel-smoke/bin/pip install dist/*.whl
          /tmp/osint-wheel-smoke/bin/python -c "from pathlib import Path; from core.analysis.skill_loader import load_skill; from core.platform_loader import catalogue_summary; from modules.platforms import PLATFORMS; import modules.providers, scripts, web; summary = catalogue_summary(PLATFORMS); assert len(PLATFORMS) == 500; assert summary['core_count'] == 100; assert summary['full_count'] == 500; assert load_skill('profile_validator').name == 'profile_validator'; assert load_skill('exec_summary').name == 'exec_summary'; assert (Path(modules.providers.__file__).parent / 'SKILL.md').is_file(); assert (Path(web.__file__).parent / 'index.html').is_file(); assert (Path(scripts.__file__).parent / 'maigret_data.json').is_file()"
