# open-source-intelligence — container topology
#
#   api : FastAPI REST + web UI (serves on :8000)
#   tor : SOCKS5 proxy on :9050 for proxied scans (optional)
#
# Usage: docker compose up --build api

services:
  api:
    build: .
    image: open-source-intelligence:latest
    container_name: open-source-intelligence-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - osint-data:/home/osint/.local/share/open-source-intelligence
      - ./reports:/data
    environment:
      - OSINT_TELEGRAM_BOT_TOKEN
      - OSINT_TELEGRAM_CHAT_ID
      - OSINT_WEBHOOK_URL
      - OSINT_WEBHOOK_SECRET
      - OSINT_AUTH_REQUIRED
      - OSINT_AUTH_SECRET
      - HIBP_API_KEY
    restart: unless-stopped

  tor:
    image: dperson/torproxy:latest
    container_name: open-source-intelligence-tor
    profiles: ["tor"]
    ports:
      - "9050:9050"
    restart: unless-stopped

volumes:
  osint-data:
